name: Activity Koi

on:
  schedule:
    # 03:37 Moscow time; render the last complete UTC day.
    - cron: "37 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/koi.yml]

permissions:
  contents: write

concurrency:
  group: profile-koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Draw the activity koi
        uses: yalongwastaken/git-koi@7305e9b1fadee6f43d3b4fa543a25d4cde79856e # v1.0.2
        with:
          login: valinerosgordov
          body: asagi
          output-dir: koi
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add -- koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: update activity animation"
          git pull --rebase origin main
          git push --quiet origin HEAD:main
